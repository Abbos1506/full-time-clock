
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makkah Digital Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock-container">
    <div class="arabic">مكة المكرمة</div>
    <h1>MAKKAH DIGITAL CLOCK</h1>

    <div class="clock-row">
      <div class="time-block">
        <span id="hours">00</span>
        <small>SOAT</small>
      </div>

      <span class="separator">:</span>

      <div class="time-block">
        <span id="minutes">00</span>
        <small>MINUT</small>
      </div>

      <span class="separator">:</span>

      <div class="time-block">
        <span id="seconds">00</span>
        <small>SEKUND</small>
      </div>

      <span class="separator">:</span>

      <div class="time-block small-block">
        <span id="milliseconds">000</span>
        <small>MILLISEKUND</small>
      </div>

      <span class="separator">:</span>

      <div class="time-block small-block">
        <span id="microseconds">000</span>
        <small>MIKROSEKUND</small>
      </div>

      <span class="separator">:</span>

      <div class="time-block small-block">
        <span id="nanoseconds">000</span>
        <small>NANOSEKUND</small>
      </div>
    </div>

    <div class="date-display" id="date">14 : OKTABR : 2026</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
